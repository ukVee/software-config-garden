[package]
name = "softfig-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "soft-fig networking (M5a): app-level Noise transport over TCP + a protobuf control plane for cross-device sync. Frontend-neutral; hosted by keeperd."

[dependencies]
snow.workspace = true
prost.workspace = true
thiserror.workspace = true
# M5a-2 pairing: SAS (HKDF-SHA256), Ed25519 attestation, the peers.toml ring.
hkdf.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
# M5d shared-key ceremony: BLAKE3 commitments + one-way key_id (the project hash).
blake3.workspace = true
# M5d slice 015: zeroize the derived shared key S + the HKDF ikm on drop so the
# establishment copy doesn't linger in freed heap/stack (LEAK-2 / NONCE-5). The
# `derive` feature gives `#[derive(Zeroize, ZeroizeOnDrop)]` for the SharedKey
# newtype. This crate is otherwise zeroize-free by design; the newtype owns the
# hygiene so callers no longer have to.
zeroize.workspace = true
serde.workspace = true
toml.workspace = true
# M5a-3 discovery: LAN mDNS (_softfig._tcp) announce + browse, no async runtime.
mdns-sd.workspace = true

[dev-dependencies]
# Tests derive an X25519 public key from a raw secret to forge attestations;
# production never needs this (the vault supplies both halves).
x25519-dalek.workspace = true
tempfile.workspace = true

[build-dependencies]
prost-build.workspace = true
