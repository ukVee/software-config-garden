syntax = "proto3";

package softfig.net.control.v1;

// Top-level wire frame for the control plane. Every control-plane message
// exchanged over an established Noise session is a Frame. The body is a oneof
// so the protocol extends by adding variants — pairing, relay, and discovery
// messages arrive in later M5a slices; data-plane messages (commit-push,
// object-fetch, ...) land in M5b+ — without breaking older peers. Field-number
// ranges are reserved below so future variants never collide.
//
// NOTE for signing (M5a-2): protobuf is not canonical. Any signed message must
// sign a defined canonical byte encoding, or carry the exact serialized bytes
// alongside the signature; never sign a re-serialization.
message Frame {
  oneof kind {
    Ping ping = 1;
    Pong pong = 2;
    // M5a-3 (relay/discovery): the control plane that carries off-LAN reach.
    RelayConnect relay_connect = 20;   // device -> relay: bridge me to a peer
    RelayData relay_data = 21;         // forwarded opaque end-to-end ciphertext
    StateAnnounce state_announce = 22; // device -> relay: register reachability
    // M5b (data plane): zero-knowledge device-chain replication, 100+. The
    // chain owner is the *source* (serves rows + ciphertext); the backup host
    // is the *sink* (drives the pull, verifies, fast-forwards a ciphertext-only
    // mirror it cannot decrypt). See softfig-net's `replica` module.
    ReplicaGrant replica_grant = 100;  // owner -> host: signed "you may mirror me"
    GetTip get_tip = 101;              // sink -> source: "what is your tip?"
    TipAnnounce tip_announce = 102;    // source -> sink: signed tip + height
    GetCommit get_commit = 103;        // sink -> source: fetch one commit row
    CommitData commit_data = 104;      // source -> sink: a commit row (or not-found)
    GetTree get_tree = 105;            // sink -> source: fetch one tree's rows
    TreeData tree_data = 106;          // source -> sink: a tree's entries (or not-found)
    GetObject get_object = 107;        // sink -> source: fetch one ciphertext blob
    ObjectData object_data = 108;      // source -> sink: ciphertext bytes (or not-found)
    ReplicaDone replica_done = 109;    // sink -> source: pull complete, close
    // M5d (shared subtrees): the collaborative commit-reveal key ceremony that
    // derives a shared subtree's key S, 200+. Both frames are signed by the
    // sender's Ed25519 identity and honoured only from ring members of the
    // ceremony's set; the pure state machine + signing-byte layout live in
    // softfig-net's `ceremony` module.
    SharedKeyCommit shared_key_commit = 200; // member -> members: signed H(r_i) + nonce
    SharedKeyReveal shared_key_reveal = 201; // member -> members: signed reveal of r_i
    // M5d slice 008 recovery: the keyed member's response to a stranded member's
    // dial. Instead of re-running the ceremony (refused for a live non-stale
    // chain — slice 006), it hands the caller the committed transcript + S.
    SharedKeyHandoff shared_key_handoff = 202; // keyed member -> stranded member: recovery hand-off
    // M5e (write-turn coordination): the active-member write-turn lease + device
    // states, 203+ (meta/spec-sync.md §"Active / idle coordination — a write-turn
    // lease"). Every frame is signed by the sender's Ed25519 identity over the
    // domain-separated encodings in softfig-net's `turn` module and honoured only
    // from S-members of the chain — a paired-but-non-member device has no role in
    // a chain's coordination, so a forged turn-request (freeze/DoS) or turn-yield
    // (induce the race) from a non-member is rejected. protobuf is not canonical:
    // the driver re-derives the signed bytes from these fields, never a
    // re-serialization. The pure lease state machine lives in the same module.
    DeviceStateAnnounce device_state_announce = 203; // member -> members: offline / online-idle / online-active (+ unlocked)
    TurnRequest turn_request = 204;                  // member -> members: request a chain's write turn
    TurnYield turn_yield = 205;                      // holder -> requester: yield the turn (the go-ahead)
    TurnRevoke turn_revoke = 206;                    // member -> members: an expired holder's lease is reclaimed
  }
  // 10,11 stay reserved for a future control-frame pairing step (M5a-2 pairing
  // rides entirely inside the Noise XX handshake, so none was spent). 12-19 and
  // 23-99 are held for later control-plane variants; 100-199 is the M5b data
  // plane; 200-201 is the M5d shared-key ceremony; 202 is the M5d slice-008
  // recovery hand-off; 203-206 is the M5e write-turn coordination; 207+ stays
  // open for later sync slices (shared-chain push, ...).
  reserved 3 to 19, 23 to 99, 110 to 199;
}

// Identity payload carried *inside* the Noise handshake (not a Frame). The XX
// handshake authenticates only the X25519 static key; this binds the device's
// Ed25519 identity to that static. The Ed25519 self-signature in field 4 is
// over the X25519 static (domain-separated — see softfig-net's `attest`
// module), completing the attestation the verifier checks during pairing.
message HelloPayload {
  uint32 protocol_version = 1;
  bytes device_id = 2;          // Ed25519 identity public key (32 bytes)
  string device_name = 3;
  bytes static_attestation = 4; // Ed25519 sig (64 bytes) over the X25519 static
  reserved 5 to 15;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;          // echoes the Ping nonce
}

// --- M5a-3 relay control plane ---------------------------------------------
//
// These frames ride inside the *outer* Noise session a device holds to the
// relay (which authenticates the device and encrypts the relay-control
// metadata). The relay terminates that outer layer. The *inner* peer-to-peer
// Noise IK session is end-to-end: its wire bytes travel as RelayData payloads,
// which the relay forwards verbatim and can neither read nor alter.

// device -> relay: "I am reachable as this device-id." Advisory; the relay
// authorizes by the authenticated outer-session static against its ring, not by
// this field, and cross-checks it against the handshake identity.
message StateAnnounce {
  bytes device_id = 1;  // Ed25519 identity public key (32 bytes)
  bool paired = 2;      // mirrors the mDNS paired/unpaired TXT flag
}

// device -> relay: "bridge me to this peer." The relay matches it against
// another registered ring-member device and splices the two outer sessions.
message RelayConnect {
  bytes target_device_id = 1;  // Ed25519 identity of the peer to reach
}

// A chunk of the inner end-to-end Noise IK session's wire bytes, forwarded
// blindly by the relay. Opaque ciphertext under keys the relay never holds.
message RelayData {
  bytes payload = 1;
}

// --- M5b data plane: device-chain replication ------------------------------
//
// One owner (single writer of a linear device chain) replicates its signed,
// content-addressed *ciphertext* to authorized backup hosts that verify and
// store it but cannot decrypt it. Two-sided consent: the host opts in
// (keeper.toml [replica] host = true) AND the owner grants the host per-peer
// (a signed ReplicaGrant minted from the owner's push_to list). The host
// fast-forwards only — a single honest owner never forks, so a non-fast-forward
// is a tamper/compromise signal the host rejects + alarms on.

// owner -> host, sent first on a replication session: "I authorize you (grantee)
// to mirror my chain." Signed by the owner's Ed25519 identity over a
// domain-separated encoding (see softfig-net's `replica::grant_signing_bytes`),
// so the host can confirm the connecting ring member really granted *this* host
// *this* chain. The owner only mints this for hosts in its push_to allow-list;
// the host only honours it when its own [replica] host flag is set.
message ReplicaGrant {
  bytes grantee_device_id = 1; // the host's Ed25519 identity (32 bytes)
  bytes chain_id = 2;          // the owner's chain id (repo_id bytes)
  int64 issued_at = 3;         // Unix seconds the grant was minted
  bytes signature = 4;         // Ed25519 over grant_signing_bytes(...)
}

// sink -> source: "what is your chain's current tip?" Empty request.
message GetTip {}

// source -> sink: the chain's current tip + height, signed by the owner. The
// signature (over tipannounce_signing_bytes) and monotonic height back the
// fast-forward-only + anti-rollback rules; per-commit signatures remain the
// authoritative integrity check. An empty tip_hash means "no commits yet".
message TipAnnounce {
  bytes chain_id = 1;
  bytes tip_hash = 2;  // 32-byte BLAKE3 commit hash; empty = no commits
  uint64 height = 3;   // commit count from genesis to tip
  bytes signature = 4; // Ed25519 over tipannounce_signing_bytes(...)
}

// sink -> source: fetch one commit row by hash.
message GetCommit {
  bytes hash = 1;
}

// source -> sink: one commit row, mirroring the store's `commits` schema. The
// sink re-canonicalizes + re-hashes, checks the Ed25519 signature under
// author_pubkey, and binds author_pubkey to the chain owner's ring identity.
message CommitData {
  bool found = 1;            // false: source has no such commit
  bytes hash = 2;
  bytes parent = 3;         // empty = genesis (no parent)
  bytes root_tree = 4;
  string author_device = 5;
  bytes author_pubkey = 6;  // Ed25519 identity (32 bytes)
  int64 timestamp = 7;
  string intent = 8;
  string payload = 9;       // canonical JCS bytes of the payload object (utf-8)
  uint32 master_key_id = 10;
  bytes signature = 11;     // Ed25519 (64 bytes) over the commit hash
}

// sink -> source: fetch one tree's entry rows by tree hash.
message GetTree {
  bytes hash = 1;
}

// source -> sink: a tree's entries. The sink verifies
// hash == BLAKE3(canonical_tree_bytes(entries)) before storing.
message TreeData {
  bool found = 1;
  bytes hash = 2;
  repeated TreeEntryMsg entries = 3;
}

message TreeEntryMsg {
  string name = 1;
  string kind = 2;   // "blob" | "tree"
  uint32 mode = 3;
  bytes target = 4;  // 32-byte hash of the child blob or subtree
}

// sink -> source: fetch one content-addressed ciphertext blob by hash.
message GetObject {
  bytes hash = 1;
}

// source -> sink: the ciphertext blob bytes. Opaque — the host stores them
// without the key. The sink verifies BLAKE3(payload) == hash. Large blobs are
// carried whole here; the transport's send_bytes/recv_bytes chunks the frame
// across Noise's 64 KiB message cap transparently.
message ObjectData {
  bool found = 1;
  bytes hash = 2;
  bytes payload = 3; // ciphertext blob_file bytes
}

// sink -> source: the pull completed; the source may close the session.
message ReplicaDone {}

// --- M5d shared-subtree key ceremony ---------------------------------------
//
// The collaborative commit-reveal ceremony that derives a shared subtree's key
// S (meta/spec-sync.md §"Crypto — the collaboratively-generated shared key S").
// Every member first broadcasts a signed commitment H(nonce ‖ device_id ‖ r_i)
// plus the ceremony nonce; only once all commitments are in does anyone reveal
// r_i, and everyone checks each reveal against the published commitment. Both
// frames are signed by the sender's Ed25519 identity over the domain-separated
// encodings in softfig-net's `ceremony` module (commit_signing_bytes /
// reveal_signing_bytes) and are honoured only from ring members of the
// ceremony's set. protobuf is not canonical: the driver re-derives the signed
// bytes from these fields — it never signs or verifies a re-serialization.

// member -> members: a signed commitment, broadcast before anyone reveals.
message SharedKeyCommit {
  bytes nonce = 1;       // 32-byte ceremony nonce
  bytes chain_id = 2;    // the shared subtree's chain id this ceremony keys
  bytes device_id = 3;   // the committer's Ed25519 identity (32 bytes)
  bytes commitment = 4;  // 32-byte BLAKE3 commitment H(nonce ‖ device_id ‖ r_i)
  bytes signature = 5;   // Ed25519 (64 bytes) over commit_signing_bytes(...)
}

// member -> members: the reveal of r_i; everyone checks it against the
// commitment it published for this ceremony. A mismatch aborts the ceremony.
message SharedKeyReveal {
  bytes nonce = 1;        // 32-byte ceremony nonce
  bytes chain_id = 2;     // the shared subtree's chain id
  bytes device_id = 3;    // the revealer's Ed25519 identity (32 bytes)
  bytes contribution = 4; // the revealed r_i (32 bytes)
  bytes signature = 5;    // Ed25519 (64 bytes) over reveal_signing_bytes(...)
}

// M5d slice 008 (responder-persist recovery) — the recovery hand-off. A member
// whose ceremony persist failed (crash mid-seal / vault locked) is left a
// transcript participant with no usable S; its unkeyed membership row makes it
// re-dial the ceremony, but the keyed peer refuses a live non-stale chain
// (slice 006). Instead of refusing, the keyed member serves this: the committed
// signed transcript plus S itself. S rides in the clear *inside* the frame —
// the enclosing Noise session (ring-authenticated: IK + attestation +
// config/peers.toml) seals it on the wire, and the signed transcript's
// membership is the entitlement: the server sends S only to the authenticated
// ring peer its own committed transcript already names. The requester verifies
// the transcript, checks key_id(S) == transcript.key_id and self ∈ members,
// then runs the idempotent persist. No new crypto — see
// decision-m5d-shared-key-recovery.
message SharedKeyHandoff {
  bytes chain_id = 1;          // the shared subtree's chain id (binds the hand-off to the dial)
  string transcript_record = 2; // the committed ceremony-record TOML (parse_transcript_record)
  bytes shared_key = 3;         // the 32-byte S; sealed on the wire by the Noise session
}

// --- M5e write-turn coordination -------------------------------------------
//
// The active/idle write-turn lease (meta/spec-sync.md §"Active / idle
// coordination — a write-turn lease"). When members are online and active,
// coordinate writers so concurrent edits to the same shared content don't
// happen in the first place: to commit to a shared subtree an active member
// must hold that chain's turn, token-passed FIFO with a deterministic tiebreak.
// The turn is a *lease*, not a lock — time-bounded, so a crashed or partitioned
// holder can't brick the subtree (its lease expires and the turn returns; that
// expiry is exactly where the LWW + sidecar fallback in slice 003 takes over).
// All frames are signed by the sender's Ed25519 identity over the
// domain-separated encodings in softfig-net's `turn` module and honoured only
// from S-members of the chain. protobuf is not canonical: the driver re-derives
// the signed bytes from these fields, never a re-serialization.

// member -> members: this device's shared-coordination state. `online-active`
// members participate in the turn handshake; `online-idle` members apply
// incoming commits immediately (nothing is editing, no handshake needed);
// `offline` implies unreachable. `unlocked` = false means online but no S in
// memory (a locked device queues S-encrypted commits until unlock). Signed so a
// peer can't forge a state that e.g. omits another device from the handshake.
message DeviceStateAnnounce {
  bytes device_id = 1;  // the announcing device's Ed25519 identity (32 bytes)
  uint32 state = 2;     // DeviceState: 0 = offline, 1 = online-idle, 2 = online-active
  bool unlocked = 3;    // S available in memory (a locked device queues commits)
  uint64 seq = 4;       // per-device monotonic logical clock (orders a stale announce vs a fresh one)
  bytes signature = 5;  // Ed25519 over device_state_signing_bytes(...)
}

// member -> members: request the chain's write turn. `seq` is the requester's
// logical request-time; the turn queues FIFO by (seq, device_id), so two
// devices requesting at once have one deterministic winner and neither
// deadlocks. `scope` is the lease's path-scope (v1 always 0 = whole subtree),
// carried from day one so a future narrowed lease is an extension, not a wire
// change.
message TurnRequest {
  bytes chain_id = 1;   // the shared subtree's chain id
  bytes device_id = 2;  // the requester's Ed25519 identity (32 bytes)
  uint64 seq = 3;       // logical request-time (the FIFO ordering key)
  uint32 scope = 4;     // LeaseScope: 0 = whole subtree (v1)
  bytes signature = 5;  // Ed25519 over turn_request_signing_bytes(...)
}

// holder -> requester: the go-ahead. Sent once the holder reaches a commit
// boundary, quiesces new commits to the subtree, and flushes the in-flight one.
// `grantee` + `seq` bind the yield to the exact request it answers, so a
// forged/stale yield can't hand the turn to the wrong device.
message TurnYield {
  bytes chain_id = 1;   // the shared subtree's chain id
  bytes device_id = 2;  // the yielding holder's Ed25519 identity (32 bytes)
  bytes grantee = 3;    // the device the turn passes to (32 bytes)
  uint64 seq = 4;       // the granted request's seq (binds the yield to the request)
  bytes signature = 5;  // Ed25519 over turn_yield_signing_bytes(...)
}

// member -> members: a holder's lease expired (it went silent past the lease
// TTL) so the turn is reclaimed — one dead device must never brick the subtree.
// `revoked` names the holder losing the turn and `epoch` the exact lease
// generation, so a resurrected holder's stale state can't be revoked twice nor a
// fresh grant killed by a late revoke.
message TurnRevoke {
  bytes chain_id = 1;   // the shared subtree's chain id
  bytes device_id = 2;  // the revoker's Ed25519 identity (32 bytes)
  bytes revoked = 3;    // the holder whose lease is being revoked (32 bytes)
  uint64 epoch = 4;     // the lease epoch (grant generation) being revoked
  bytes signature = 5;  // Ed25519 over turn_revoke_signing_bytes(...)
}
