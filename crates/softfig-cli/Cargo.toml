[package]
name = "softfig-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "soft-fig CLI: vault subcommands now, more later."

[[bin]]
name = "softfig"
path = "src/main.rs"

[dependencies]
softfig-vault.workspace = true
softfig-store.workspace = true
softfig-vcs.workspace = true
softfig-ipc.workspace = true
softfig-growlightd-client.workspace = true
# claude-login-switcher: `claude-login status` reads the budget-aware picker's
# per-profile samples, pins and runtime dir through growlightd's own functions
# (profile_budget, profile_pin, fleet::runtime_growlight_dir) rather than
# re-deriving them. The growlightd crate stays lean (serde/toml/thiserror/
# anyhow/clap/signal-hook/libc/rusqlite — no tokio), so this is one edge, not
# a transitive bloom.
softfig-growlightd.workspace = true
softfig-onboard.workspace = true
softfig-deploy.workspace = true
clap.workspace = true
hostname.workspace = true
rpassword.workspace = true
anyhow.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
# queue-v2-state slice 009: the §6.9 CLI-form e2e test boots a real keeperd on
# a temp garden + socket (no FUSE) and drives the forms over the wire exactly
# as the binary sends them — the same fixture shape keeperd's own e2e suite
# uses. Dev-only — the CLI's command code talks to keeperd over IPC only.
softfig-keeperd.workspace = true
# claude-login-switcher: isolate the HOME-rooted filesystem tests in a temp
# directory. Dev-only — prod uses hand-rolled sibling tempfiles.
tempfile.workspace = true
