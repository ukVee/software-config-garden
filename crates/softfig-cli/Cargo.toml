[package]
name = "softfig-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "soft-fig CLI: vault subcommands now, more later."

[[bin]]
name = "softfig"
path = "src/main.rs"

[dependencies]
softfig-vault.workspace = true
softfig-store.workspace = true
softfig-vcs.workspace = true
softfig-ipc.workspace = true
softfig-growlightd-client.workspace = true
softfig-onboard.workspace = true
softfig-deploy.workspace = true
clap.workspace = true
hostname.workspace = true
rpassword.workspace = true
anyhow.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Tests boot a real growlightd Daemon on a temp socket as the fake-agent fixture
# for the slice-004 client + e2e tests (spec §13). Dev-only — the CLI client
# code depends solely on the shared wire types in softfig-ipc::growlightd.
softfig-growlightd.workspace = true
# queue-v2-state slice 009: the §6.9 CLI-form e2e test boots a real keeperd on
# a temp garden + socket (no FUSE) and drives the forms over the wire exactly
# as the binary sends them — the same fixture shape keeperd's own e2e suite
# uses. Dev-only — the CLI's command code talks to keeperd over IPC only.
softfig-keeperd.workspace = true
