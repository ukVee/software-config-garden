[package]
name = "softfig-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "soft-fig terminal UI: a ratatui frontend over softfig-keeperd (browse, history, actions, unlock)."

[[bin]]
name = "softfig-tui"
path = "src/main.rs"

[dependencies]
softfig-ipc.workspace = true

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which we use to
# clamp preview scrolling to the wrapped line count (the garden's markdown has
# long single-line paragraphs, so a raw line count would badly under-count).
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
crossterm.workspace = true
