[package]
name = "softfig-keeperd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "soft-fig per-device daemon: holds the unlocked Vault session, serves IPC, fires watcher commits."

[[bin]]
name = "softfig-keeperd"
path = "src/main.rs"

[dependencies]
softfig-vault.workspace = true
softfig-store.workspace = true
softfig-vcs.workspace = true
softfig-ipc.workspace = true
softfig-fuse = { path = "../softfig-fuse" }
softfig-net.workspace = true
# M4 deploy verbs (deploy_plan/deploy_apply) — the daemon runs softfig-deploy's
# plan/apply on the TUI's behalf so the frontend never touches the FS itself.
softfig-deploy.workspace = true

serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
# growlight peer-isolation slice 003 — surgical `[build_caps]` edit in
# config/growlight.toml (preserve comments + the rest of the fleet config).
toml_edit.workspace = true

notify.workspace = true
notify-debouncer-full.workspace = true
signal-hook.workspace = true
libc.workspace = true
globset.workspace = true
walkdir.workspace = true

# M5a-4 — host the softfig-net instance: construct the mDNS ServiceDaemon and
# drain its browse events (softfig-net owns the announce/browse/parse logic).
mdns-sd.workspace = true

# M2c — inline <vault> tag parsing + base64 inline ciphertext bodies
base64.workspace = true

# M5d — wipe the daemon's stack copy of a ceremony-derived shared key S after
# it is sealed under the vault (softfig-net stays zeroize-free by design).
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
# M5a-4 pairing test: forge a second device (Ed25519 id + X25519 static +
# attestation) to run `pair_responder` over loopback TCP against the daemon's
# `pair_begin`. Production never forges — the vault supplies both halves.
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
# wire-loose-ends slice 002: boot a real growlightd on a tempdir socket to drive
# the keeperd→growlightd lease hop end to end (growlightd depends only on
# softfig-ipc, so this dev edge is acyclic).
softfig-growlightd.workspace = true
