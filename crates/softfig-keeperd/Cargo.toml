[package]
name = "softfig-keeperd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "soft-fig per-device daemon: holds the unlocked Vault session, serves IPC, fires watcher commits."

[[bin]]
name = "softfig-keeperd"
path = "src/main.rs"

[dependencies]
softfig-vault.workspace = true
softfig-store.workspace = true
softfig-core.workspace = true
softfig-ipc.workspace = true
softfig-fuse = { path = "../softfig-fuse" }
softfig-net.workspace = true

serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
toml.workspace = true

notify.workspace = true
notify-debouncer-full.workspace = true
signal-hook.workspace = true
libc.workspace = true
globset.workspace = true
walkdir.workspace = true

# M5a-4 — host the softfig-net instance: construct the mDNS ServiceDaemon and
# drain its browse events (softfig-net owns the announce/browse/parse logic).
mdns-sd.workspace = true

# M2c — inline <vault> tag parsing + base64 inline ciphertext bodies
base64.workspace = true

[dev-dependencies]
tempfile = "3"
# M5a-4 pairing test: forge a second device (Ed25519 id + X25519 static +
# attestation) to run `pair_responder` over loopback TCP against the daemon's
# `pair_begin`. Production never forges — the vault supplies both halves.
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
