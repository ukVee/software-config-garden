[package]
name = "softfig-runnerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "soft-fig remote runner daemon: a system service under its own uid that runs sandboxed build/test jobs for a paired requester."

[dependencies]
# Runner keys: Ed25519 attest (signs job attestations) + X25519 transport static
# (Noise key agreement). Deliberately NOT vault-sealed, and this crate never
# links softfig-vault (spec §3.1 — the runner stays up while the garden is
# locked; an escape must not reach a key that can read the garden).
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
rand.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
hex.workspace = true
thiserror.workspace = true
libc.workspace = true
# Slice 003: the wire listener. runnerd links softfig-net for the Noise
# transport + control-plane frames + the runner certificate handshake. This does
# NOT pull in softfig-vault (softfig-net is vault-free), so the "never links
# softfig-vault / never reads a garden" constraint still holds (spec §3.1).
softfig-net.workspace = true
# Runner mDNS (_softfig-runner._tcp) announce; the mdns-sd ServiceDaemon is
# owned here and handed to softfig-net's discovery helpers.
mdns-sd.workspace = true
# Slice 004: the source step (git snapshot have/want bundle, ingest, verify,
# materialize). Vault-free, so the "never links softfig-vault" constraint holds.
softfig-source.workspace = true
# Slice 004 materializes the ingested tree into a scratch dir (the real
# sandboxed job dir lands in slice 006).
tempfile.workspace = true
# Slice 006: the real executor runs the fetch/run/collect steps inside
# softfig-sandbox profiles (bwrap + Landlock + seccomp). Vault-free, so the
# "never links softfig-vault" constraint holds.
softfig-sandbox.workspace = true

[dev-dependencies]
tempfile.workspace = true
