[package]
name = "softfig-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "soft-fig MCP stdio bridge: per-Claude-session translator from MCP JSON-RPC to softfig-keeperd IPC."

[[bin]]
name = "softfig-mcp"
path = "src/main.rs"

[dependencies]
# The facade stays for `member::{MemberIdentity, HUMAN_QUEUE_VERBS,
# HUMAN_QUEUE_VERB_WHY}` and `queue_v2::QueueRefusal`, which did not move and
# have no home in a no-IO crate (`member` reads `$SOFTFIG_MEMBER`;
# spec-softfig-tui-frontend-split §10 reopens it at `tui-split-directord`).
# Every *wire* type this bridge names comes from the two protocol crates
# directly, so the two-crate ambiguity review 060 F8 raised is gone.
softfig-ipc.workspace = true
softfig-protocol-keeperd.workspace = true
softfig-protocol-growlightd.workspace = true
softfig-client.workspace = true

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
