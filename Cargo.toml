[workspace]
resolver = "2"
members = [
    "crates/softfig-vault",
    "crates/softfig-store",
    "crates/softfig-vcs",
    "crates/softfig-cli",
    "crates/softfig-ipc",
    "crates/softfig-keeperd",
    "crates/softfig-growlightd",
    "crates/softfig-growlightd-client",
    "crates/softfig-growlight-gui",
    "crates/softfig-mcp",
    "crates/softfig-fuse",
    "crates/softfig-onboard",
    "crates/softfig-tui",
    "crates/softfig-deploy",
    "crates/softfig-net",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/ukVee/software-config-garden"

[workspace.dependencies]
softfig-vault   = { path = "crates/softfig-vault" }
softfig-store   = { path = "crates/softfig-store" }
softfig-vcs    = { path = "crates/softfig-vcs" }
softfig-ipc     = { path = "crates/softfig-ipc" }
softfig-growlightd = { path = "crates/softfig-growlightd" }
softfig-growlightd-client = { path = "crates/softfig-growlightd-client" }
softfig-growlight-gui = { path = "crates/softfig-growlight-gui" }
softfig-onboard = { path = "crates/softfig-onboard" }
softfig-deploy  = { path = "crates/softfig-deploy" }
softfig-net     = { path = "crates/softfig-net" }

# Crypto
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
blake3 = "1.5"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
rand = "0.8"
rand_core = "0.6"
bip39 = { version = "2", default-features = false, features = ["rand", "std"] }
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }

# Encoding / IO
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
toml = "0.8"
hex = "0.4"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Filesystem / time / identity helpers
walkdir = "2"
hostname = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

# M-onboard — embedded default-garden skeleton template
include_dir = "0.7"

# Errors
thiserror = "2"

# CLI
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
anyhow = "1"

# Daemon / watcher
notify = "6"
notify-debouncer-full = "0.3"
signal-hook = "0.3"
libc = "0.2"

# Layer B sealed-paths glob matching (M2b)
globset = "0.4"

# M2c — inline <vault> tag parsing (TOML) + base64-inline ciphertext bodies
toml_edit = "0.22"
base64 = "0.22"

# FUSE
fuser = "0.14"
lru = "0.12"

# TUI (M3b)
ratatui = "0.29"
crossterm = "0.28"

# Networking — M5a transport + pairing (softfig-net)
# App-level Noise (snow) over TCP; protobuf control plane (prost).
snow = "0.10"
prost = "0.14"
prost-build = "0.14"
# M5a-3 discovery: mDNS / DNS-SD with no async runtime dependency.
mdns-sd = "0.20"

# GUI — the growlight fleet console (spec §11). HEAVY NEW DEPENDENCY, FLAGGED for
# human merge review. Pinned to 0.14.x. Pulled in ONLY behind the off-by-default
# `gui` feature of `softfig-growlight-gui`, so `cargo check --workspace` never
# compiles it; the literal window render is the §7b on-device deferred check.
# wgpu renderer (the default/best-tested path; presents via the Vulkan/GL surface
# on the Phosh tablet) + the winit `x11`/`wayland` shell backends + the tokio
# executor. `default-features = false` deliberately drops the default `tiny-skia`
# renderer, which pulls `softbuffer` (fails to compile headless: no display
# backend → empty dispatch enums); the `x11`/`wayland` features must then be
# re-added explicitly or winit errors "platform not supported". No software
# fallback in this build — the tablet has Vulkan; a tiny-skia fallback can be
# added once softbuffer builds in the target environment.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "x11", "wayland"] }

[profile.release]
lto = "thin"
codegen-units = 1
