# soft-fig growlight fleet config.
#
# This file IS garden content: encrypted at rest, versioned by the VCS, carried
# along by M5b backup, and read by growlightd *through* the FUSE mount. Edit it
# here (directly through the mount, or via softfig-mcp) — keeperd re-reads the
# gate each time it unlocks and starts/stops the `softfig-growlightd.service`
# user unit to match; growlightd re-reads the full config when it (re)starts.
#
# It is the SOLE source of fleet config. The local `.softfig/keeper.toml`
# bootstrap pointer keeps only `state_root` and the `[growlight] allow_relock`
# security opt-in — no fleet keys.

# The gate. false = the fleet is DISARMED: growlightd assembles no drive loop and
# keeperd does not start its unit. Flip to true to arm the fleet on the next
# unlock / `softfig daemon cycle`. (Runaway protection is the budget halts +
# `growlight pause`, not human-presence-to-arm — see
# journal/decisions/decision-growlight-config-in-garden.md.)
fleet_enabled = false

# Bounded-run knob for controlled debugging — the growlightd equivalent of the
# retired `--auto --max-iterations`. Stops the fleet CLEANLY after this many
# completed member work-chunks (clean continue / item-boundary handoffs), then
# holds every spawn until growlightd is restarted (which re-arms a fresh bounded
# batch). `1` = single-shot (run one iteration and stop). Omit the key for an
# unbounded run (the normal armed fleet); `0` is rejected. Read once at arm time.
# max_iterations = 1

# The binary each backend shells. Both default to the bare name on PATH. Two keys
# rather than one because a mixed roster runs both at once.
# claude_bin   = "claude"
# opencode_bin = "opencode"

# The generic per-agent turn kick passed as `claude -p <prompt>` / the trailing
# argument of `opencode run`. Defaults to the built-in "begin this iteration"
# kick; the boot hook injects the protocol + baton regardless, on either backend.
# prompt = "..."

# The roster: one [[fleet]] block per agent. `agent` is the work-stream id
# (the @-stripped name); `pin` optionally binds it to one queue (omit for a
# fallback-only member). growlightd OWNS each agent's pre-approval paths — the
# config never names file paths.
#
# `backend` says which agent backend the member runs on and defaults to `claude`,
# so a roster written before per-member selection existed keeps running exactly as
# it did. `model` / `variant` are opencode-only and ride the generated opencode
# config rather than argv; omit either to leave opencode its own default.
#
# Three mistakes here are REFUSED at arm time rather than defaulted, because all
# three end with a member burning a pool the operator did not choose: an unknown
# `backend` value, `model`/`variant` on a claude member, and any unknown key (a
# dropped `backends = "opencode"` typo would silently mean claude). A refusal
# fails closed — the fleet stays disarmed.
#
# An opencode member is METERED, so `growlight status` and the TUI fleet panel show
# it as "opencode · <model> · $0.14 this session" rather than against the Anthropic
# 5h/7d reserve, which it does not draw on. A claude member shows no per-member
# dollar figure: its cost IS that shared reserve. Spend is accounted per session in
# memory and is not a cap — see the doc below.
#
# Full reference: docs/growlight-fleet-backends.md.
#
# [[fleet]]
# agent = "a"                              # backend omitted ⇒ claude
# # pin = "<queue-name>"
#
# [[fleet]]
# agent   = "b"
# backend = "opencode"                     # claude (default) | opencode
# model   = "deepseek/deepseek-v4-flash"   # opencode only
# variant = "high"                         # opencode only, optional
