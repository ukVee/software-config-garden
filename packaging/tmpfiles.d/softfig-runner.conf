# softfig-runner state root — created 0700, owned by softfig-runner, so an
# escape from the runner account cannot reach into it from elsewhere and the
# owner's account cannot be reached from it.
# Install with: install -Dm0644 packaging/tmpfiles.d/softfig-runner.conf \
#   /etc/tmpfiles.d/softfig-runner.conf && systemd-tmpfiles --create
d /var/lib/softfig-runner 0700 softfig-runner softfig-runner -
