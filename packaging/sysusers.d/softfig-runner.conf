# softfig-runner — the remote-runner daemon's dedicated system user.
# No login shell, no home in /home: the state root is /var/lib/softfig-runner.
# Install with: install -Dm0644 packaging/sysusers.d/softfig-runner.conf \
#   /etc/sysusers.d/softfig-runner.conf && systemd-sysusers
u softfig-runner - "soft-fig remote runner" /var/lib/softfig-runner /usr/bin/nologin
