name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# No `cargo fmt` job here: the tree is not yet rustfmt-clean, so fmt would be
# red on arrival. `cargo clippy --all-targets --locked -- -D warnings` (the clippy job
# below) is this repo's style gate, per CLAUDE.md's build/test/run section.
#
# Every action is pinned to a full commit SHA, never a floating tag — a mutable
# `@v4` can be repointed by a compromised action repo (meta/spec-install.md →
# "CI pipeline" → "hardening"). The `# <tag>` comment names the ref the SHA was
# taken from.
jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install system deps (protoc + libfuse3)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libfuse3-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install system deps (protoc + libfuse3)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libfuse3-dev
      - run: cargo test --workspace --no-fail-fast --locked

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install system deps (protoc + libfuse3)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libfuse3-dev
      - run: cargo build --workspace --release --locked

  # The rescue artifact must build without the FUSE stack (meta/spec-release.md
  # → "What CI must prove"): this job deliberately installs no protoc and no
  # libfuse3-dev, so a stray FUSE link or protoc dependency in the rescue crate
  # fails here. The readelf check then proves the built binary needs no libfuse.
  rescue:
    name: rescue (no-FUSE, minimal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the rescue artifact (no system deps)
        run: cargo build -p softfig-rescue --release --locked
      - name: Prove the rescue binary needs no libfuse3
        run: |
          set -euo pipefail
          if readelf -d target/release/softfig-rescue 2>/dev/null | grep -qi 'libfuse'; then
            echo "softfig-rescue needs libfuse — the rescue profile must not require FUSE" >&2
            exit 1
          fi
          echo "rescue binary needs no libfuse"

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install system deps (protoc + libfuse3)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libfuse3-dev
      - run: cargo check --workspace --all-targets --locked

  deny:
    name: deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
